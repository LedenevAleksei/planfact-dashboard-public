# Railway (nixpacks) — тот же стек, что у ServiceBot.
# Одна служба: Flask-бэкенд отдаёт дашборд за паролем + серверный /refresh + cron 10:00.
# Переменные (задать в панели Railway → Variables):
#   PLANFACT_API_KEY, DASH_USER, DASH_PASS  (и по желанию DASH_TZ, DASH_REFRESH_HOUR)
[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn app:app --workers 1 --timeout 300 --bind 0.0.0.0:$PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
